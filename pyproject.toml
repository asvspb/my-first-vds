[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vds-cli"
version = "3.0.0"
description = "VDS Management & ZeroTier Orchestrator"
readme = "README.md"
authors = [
    { name = "ASV" }
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "requests>=2.31.0",
    "psutil>=5.9.6",
    "pydantic>=2.5.2",
    "questionary>=2.0.1"
]
requires-python = ">=3.10"

# Versions source of truth: requirements.txt (used by install.sh).
# Lower bounds here mirror requirements.txt pins.

[project.optional-dependencies]
dev = [
    "pytest>=8.0"
]

[project.scripts]
vds = "src.main:app"

[tool.setuptools.packages.find]
include = ["src*"]
